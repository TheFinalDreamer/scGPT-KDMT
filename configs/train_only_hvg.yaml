# Train-only HVG experiment configuration
# Selects HVGs using only the training set (not the full dataset) to avoid
# information leakage from validation/test sets into gene selection.

data_path: "outputs/processed/pbmc10x_train_only_hvg"
output_dir: "outputs/train_only_hvg"
teacher_checkpoint: "outputs/teacher/teacher_best.pth"
seed: 42

# HVG selection
n_top_genes: 2000

# Student model
input_dim: 2000
hidden_dim: 128
num_heads: 4
num_layers: 3
num_classes: 31

# Teacher model
teacher_input_dim: 2000
teacher_hidden_dim: 128
teacher_num_heads: 4
teacher_num_layers: 3

# Training
batch_size: 64
num_epochs: 50
lr: 0.001
weight_decay: 0.0001

# KD settings
use_kd: true
use_kd_feat: true
use_kd_logit: true
kd_temperature: 2.0

# Auxiliary objectives
use_recon: true
use_mask: true
use_contrast: true

# Loss weights
lambda_feat: 0.5
lambda_logit: 0.5
lambda_recon: 0.5
lambda_mask: 0.5
lambda_contrast: 0.5

mask_ratio: 0.15
