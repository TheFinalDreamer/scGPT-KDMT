# scGPT-KDMT student multi-task knowledge distillation configuration

data_path: "outputs/processed/pbmc10x"
output_dir: "outputs/kdmt_student"
teacher_checkpoint: "outputs/teacher/teacher_best.pth"
seed: 42

# Student model (2.92M params with input_dim=2000, hidden_dim=128, num_layers=3)
input_dim: 2000
hidden_dim: 128
num_heads: 4
num_layers: 3
num_classes: 31

# Teacher model (for KD, matches student input_dim for compatibility)
teacher_input_dim: 2000
teacher_hidden_dim: 128
teacher_num_heads: 4
teacher_num_layers: 3

# Training
batch_size: 64
num_epochs: 50
lr: 0.001
weight_decay: 0.0001

# Knowledge distillation
use_kd: true
use_kd_feat: true
use_kd_logit: true
kd_temperature: 2.0

# Auxiliary objectives
use_recon: true
use_mask: true
use_contrast: true

# Loss weights
lambda_feat: 0.5
lambda_logit: 0.5
lambda_recon: 0.5
lambda_mask: 0.5
lambda_contrast: 0.5

# Masking
mask_ratio: 0.15