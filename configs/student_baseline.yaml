# Student baseline configuration
# Trains the lightweight student model with only supervised classification loss
# (no knowledge distillation, no auxiliary objectives).

data_path: "outputs/processed/pbmc10x"
output_dir: "outputs/student_baseline"
seed: 42

# Student model
input_dim: 2000
hidden_dim: 128
num_heads: 4
num_layers: 3
num_classes: 31

# Training
batch_size: 64
num_epochs: 50
lr: 0.001
weight_decay: 0.0001

# All KD and auxiliary objectives disabled
use_kd: false
use_kd_feat: false
use_kd_logit: false
use_recon: false
use_mask: false
use_contrast: false
